# The venue's default layout: the two-column shell the walkthrough demonstrates.
#
# Left column is a force graph (structure, relations, state); right column is ONE stream —
# a rack bound to the `chat` data slot, with the input pinned at its foot. No menu, no tabs,
# no routes: navigation is a relation, not a category.
#
# This file is application CONTENT: the shell an application answers the `view:connect`
# event with (prism has no layout configuration any more — `PRISM_INIT` is gone). Nothing
# about it is compiled into the renderer, and nothing about it lives in prism's code —
# swap the source, keep the front end.
#
# One frame, `create`: the whole shell. Everything later is `set`/`append`/`patch` against
# the slots this frame declares (`graph`, `chat`).
- action: create
  slot: ""
  data:
    type: case
    attrs:
      class:
        - maximize
        - stage-split
      horizontal: true
    children:
      # ---- left: the graph ----------------------------------------------------------
      - type: case
        attrs:
          class:
            - stage-graph
        children:
          - type: forcegraph
            attrs:
              width: 100%
              height: 100%
            style:
              fit_padding_px: 56
            bind:
              value:
                kind: source
                source: graph
      # ---- right: the stream --------------------------------------------------------
      - type: case
        attrs:
          class:
            - stage-stream
            - main
            - shrink
        children:
          - type: rack
            attrs:
              class:
                - --message
                - box
                - ac-start
                - gap
                - scrolly
              scroll: true
            bind:
              value:
                kind: source
                source: chat
            item:
              # A message from the user: right-aligned, the accent edge.
              - type: case
                attrs:
                  class:
                    - nogrow
                    - as-end
                    - accent
                    - box
                    - border
                    - round
                    - shadow
                  selector: ask
              # Everything else (the answer, tool output): full width.
              - type: case
                attrs:
                  class:
                    - nogrow
                    - as-stretch
                    - box
                    - border
                    - round
                    - shadow
          - type: case
            attrs:
              class:
                - --input
                - nogrow
                - box
                - horizontal
            children:
              - type: case
                attrs:
                  horizontal: true
                children:
                  - type: input
                    id: prompt
                    # The uplink: fluxen emits this INTENT on the ONE socket; the venue's
                    # renderer leg dispatches it (today to the booth named `turn.submit`).
                    bind:
                      value:
                        kind: dest
                        dest: turn.submit